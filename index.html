<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUET Alumni CV Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#FAF8F6;
  --surface:#FFFFFF;
  --ink:#222222;
  --ink-soft:#555555;
  --primary:#C90000;
  --primary-dark:#A10000;
  --primary-tint:#FDEAEA;
  --accent:#F5A000;
  --accent-tint:#FFF3DE;
  --border:#EBE3DC;
  --danger:#A02A2A;
  --danger-bg:#FBEAE8;
  --success:#2E7D4F;
  --success-bg:#E9F5EE;
  --warn:#9C6B12;
  --warn-bg:#FBF1DD;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
h1,h2,h3,.serif{font-family:'Source Serif 4',serif;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--primary);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#D8D3C6;border-radius:6px;}

#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:224px;flex-shrink:0;background:#fff;color:var(--ink);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 0;position:sticky;top:0;height:100vh;
}
.brand{padding:0 20px 20px;border-bottom:3px solid var(--accent);margin-bottom:14px;position:relative;}
.brand::before{content:"";position:absolute;left:0;top:-22px;width:5px;height:40px;background:linear-gradient(180deg,var(--primary),var(--accent));}
.brand-mark{font-family:'Source Serif 4',serif;font-weight:700;font-size:19px;letter-spacing:.2px;color:var(--primary);padding-left:6px;}
.brand-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;padding-left:6px;}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;
  color:#555;font-size:14px;font-weight:500;background:none;border:none;text-align:left;width:100%;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75;}
.nav-item:hover{background:var(--primary-tint);color:var(--primary-dark);}
.nav-item.active{background:var(--primary);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-footer{margin-top:auto;padding:14px 20px 0;font-size:11px;color:#9A9A9A;border-top:1px solid var(--border);}

/* Main */
main{flex:1;padding:30px 34px 60px;max-width:1240px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-size:23px;margin:0 0 4px;color:var(--primary-dark);}
.page-head p{margin:0;color:var(--ink-soft);font-size:13.5px;}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:7px;font-size:13.5px;
  font-weight:600;border:1px solid transparent;background:var(--primary);color:#fff;transition:.15s;
}
.btn:hover{background:var(--primary-dark);}
.btn.secondary{background:#fff;color:var(--primary);border-color:var(--border);}
.btn.secondary:hover{background:#F1EEE6;}
.btn.gold{background:var(--accent);color:#26210F;}
.btn.gold:hover{filter:brightness(0.95);}
.btn.danger{background:var(--danger);color:#fff;}
.btn.ghost{background:none;color:var(--ink-soft);border-color:var(--border);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:6px 10px;font-size:12.5px;}
.icon-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--ink-soft);}
.icon-btn:hover{background:#F1EEE6;color:var(--primary);}

/* Cards / stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:16px;margin-bottom:26px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 2px 10px rgba(180,40,20,0.05);border-top:3px solid var(--primary);}
.stat-card .num{font-family:'Source Serif 4',serif;font-size:30px;font-weight:600;color:var(--primary-dark);}
.stat-card .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.stat-card.warn .num{color:var(--warn);}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:0 2px 10px rgba(180,40,20,0.04);}
.panel + .panel{margin-top:18px;}
.panel h3{margin:0 0 14px;font-size:15px;color:var(--primary-dark);}

/* Dropzone */
.dropzone{
  border:1.5px dashed var(--border);border-radius:var(--radius);padding:34px 20px;text-align:center;
  color:var(--ink-soft);font-size:13.5px;background:#FBFAF6;
}
.dropzone.drag{border-color:var(--accent);background:var(--accent-tint);}
.dropzone input{display:none;}
.photo-upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px;}
.photo-upload-row input[type=file]{display:none;}

/* Table */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar input[type=text], .toolbar select{
  padding:8px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;color:var(--ink);
}
.toolbar input[type=text]{min-width:220px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 10px;color:var(--ink-soft);font-weight:600;border-bottom:1.5px solid var(--border);font-size:12px;text-transform:none;}
td{padding:9px 10px;border-bottom:1px solid #EEEBE2;vertical-align:middle;}
tr:hover td{background:#FAF8F2;}
.thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--border);background:#EFEBE0;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.ok{background:var(--success-bg);color:var(--success);}
.badge.missing{background:var(--warn-bg);color:var(--warn);}
.badge.bad{background:var(--danger-bg);color:var(--danger);}
.row-actions{display:flex;gap:5px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
.empty-state h3{color:var(--primary-dark);margin-bottom:6px;}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.form-grid .full{grid-column:1/-1;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input, .field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;
  font-family:inherit;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:56px;}
.field .hint{font-size:11px;color:#9AA0AE;margin-top:4px;}
.field.error input, .field.error textarea{border-color:var(--danger);}
.field .err-msg{font-size:11.5px;color:var(--danger);margin-top:4px;}
.photo-preview{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.photo-preview img{width:76px;height:76px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:#EFEBE0;}
.form-actions{display:flex;gap:10px;margin-top:20px;border-top:1px solid var(--border);padding-top:18px;}
.dyn-entry{border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin-bottom:12px;background:#FCFAF6;}
.dyn-entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.dyn-entry-title{font-weight:700;font-size:12px;color:var(--primary);text-transform:uppercase;letter-spacing:.3px;}
.dyn-remove{background:#fff;border:1px solid var(--border);color:var(--danger);width:26px;height:26px;border-radius:6px;font-size:16px;line-height:1;cursor:pointer;}
.dyn-remove:hover{background:var(--danger-bg);}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,20,28,0.55);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:24px;
}
.modal-box{background:#fff;border-radius:10px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:0;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
.modal-head h3{margin:0;font-size:16px;color:var(--primary-dark);}
.modal-body{padding:22px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);}

/* Toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.14);color:#fff;background:var(--primary-dark);max-width:340px;}
.toast.error{background:var(--danger);}
.toast.success{background:var(--success);}
.toast.warn{background:var(--warn);}

/* CV preview (mirrors PDF layout) — single-column design matching the provided reference CV.
   Colors are scoped as CV-only custom properties so the admin dashboard's
   own theme (--primary/--accent etc.) is completely unaffected. */
.cv-sheet{
  --cv-red:#C8102E; --cv-orange:#C9812E; --cv-cream:#F6E8D8; --cv-header-bg:#FCF2E8; --cv-ink:#202225; --cv-body:#33363B; --cv-soft:#7A7A7A;
  width:210mm;min-height:297mm;background:#fff;margin:0 auto;
  box-shadow:0 0 0 1px var(--border);font-family:'Inter',sans-serif;color:var(--cv-body);
  display:flex;flex-direction:column;overflow:hidden;
}
.cv-topbar{display:none;}
.cv-content{flex:1;}
.cv-headwrap{background:var(--cv-header-bg);color:var(--cv-ink);padding:8mm 12mm 7mm;border-radius:0 0 10px 10px;}
.cv-header{display:flex;align-items:center;gap:6mm;}
.cv-photo{width:26mm;height:26mm;border-radius:6px;object-fit:cover;border:1.5px solid #ddd0bd;background:#EFEBE0;flex-shrink:0;}
.cv-id{flex:1;min-width:0;}
.cv-id h2{font-family:'Poppins',sans-serif;margin:0 0 1.5mm;font-size:24px;font-weight:800;letter-spacing:.2px;line-height:1.1;color:var(--cv-red);}
.cv-id .subtitle{font-size:12.5px;font-weight:700;color:#fff;margin-bottom:1.4mm;}
.cv-id .university{font-size:10.5px;color:#fff;margin-bottom:2.4mm;}
.cv-contact-rows{display:flex;flex-direction:column;gap:1.3mm;}
.cv-contact-line{display:flex;flex-wrap:wrap;gap:6mm;}
.cv-contact-row{display:flex;align-items:center;gap:1.8mm;font-size:10px;color:var(--cv-body);}
.cv-contact-row a{color:var(--cv-body);text-decoration:none;}
.ic{width:4.6mm;height:4.6mm;border-radius:50%;background:var(--cv-red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ic svg{width:2.5mm;height:2.5mm;color:#fff;}
.cv-logos{display:flex;gap:2.4mm;align-items:flex-start;flex-shrink:0;}
.cv-logos img{height:15mm;width:auto;object-fit:contain;}
.cv-main-single{padding:6mm 12mm 4mm;}
.cv-section{margin-bottom:5mm;}
.cv-section:last-child{margin-bottom:0;}
.cv-section-head h4{font-family:'Poppins',sans-serif;margin:0 0 1.4mm;font-size:12.5px;font-weight:700;letter-spacing:.3px;color:var(--cv-red);}
.cv-section-head .rule{height:1px;background:var(--cv-orange);width:100%;margin-bottom:2.6mm;}
.cv-section p{margin:0;font-size:11px;line-height:1.5;color:var(--cv-body);}
.cv-academic-row{display:flex;justify-content:space-between;gap:4mm;font-size:11.5px;}
.cv-academic-degree{font-weight:700;color:var(--cv-ink);}
.cv-academic-dept{color:var(--cv-soft);}
.cv-academic-uni{font-size:11px;font-weight:700;color:var(--cv-orange);margin-top:1mm;}
.cv-tags{display:flex;flex-wrap:wrap;gap:2mm;}
.cv-tag{background:var(--cv-cream);color:var(--cv-ink);font-weight:600;font-size:10.5px;padding:1.3mm 3.4mm;border-radius:20px;}
.cv-list{margin:0;padding:0;list-style:none;font-size:11px;line-height:1.6;color:var(--cv-body);}
.cv-list li{position:relative;padding-left:3.2mm;}
.cv-list li::before{content:"\2022";position:absolute;left:0;color:var(--cv-body);}
.cv-entry{margin-bottom:3.6mm;}
.cv-entry:last-child{margin-bottom:0;}
.cv-entry-row{display:flex;justify-content:space-between;align-items:baseline;gap:4mm;}
.cv-entry-title{font-size:12px;font-weight:700;color:var(--cv-ink);}
.cv-entry-dates{font-size:10px;color:var(--cv-soft);white-space:nowrap;}
.cv-entry-org{font-size:11px;font-weight:600;color:var(--cv-orange);margin:0.3mm 0 1mm;}
.cv-entry-desc-line{margin:0;font-size:11px;line-height:1.5;color:var(--cv-body);}
.cv-footer{flex-shrink:0;border-top:1px solid #eee;padding:3mm 12mm;text-align:center;font-size:9px;color:var(--cv-soft);}
@media (max-width:1000px){
  .cv-sheet{width:100%;}
  .cv-header{flex-wrap:wrap;}
}
@media (max-width:880px){
  .form-grid{grid-template-columns:1fr;}
  .sidebar{width:64px;}
  .brand-sub, .nav-item span{display:none;}
}
</style>
</head>

  ⚠️ You're opening this file directly (<code style="background:rgba(255,255,255,0.15);padding:1px 5px;border-radius:4px;">file://</code>).
  <strong>PDF generation will not work</strong> until you run it via a local web server — see the README's

  <button onclick="this.parentElement.style.display='none'" style="margin-left:12px;background:rgba(255,255,255,0.2);border:none;color:#fff;padding:3px 10px;border-radius:5px;cursor:pointer;">Dismiss</button>
</div>
<div id="app">
  <nav class="sidebar">
    <div class="brand">
      <img id="sidebarLogo" alt="MUET" style="height:30px;display:block;margin-bottom:8px;padding-left:6px;">
      <div class="brand-mark">MUET Alumni</div>
      <div class="brand-sub">Management System</div>
    </div>
    <div class="nav" id="nav">
      <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Dashboard</span></button>
      <button class="nav-item" data-view="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg><span>Import Excel</span></button>
      <button class="nav-item" data-view="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18"/><path d="M9 4v16"/></svg><span>Alumni Records</span></button>
      <button class="nav-item" data-view="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M18 8h3M19.5 6.5v3"/></svg><span>Add Alumni</span></button>
    </div>
    <div class="sidebar-footer">Alumni Office Portal<br>build 2026-save-fix-1</div>
  </nav>
  <main id="main"></main>
</div>
<div id="toast-wrap"></div>

<script>
/* ============================== STATE ============================== */
const SCHEMA_FIELDS = ["department","degree","rollNumber","name","email","contact","linkedin","aspiration","fyp","skills","extracurricular","professionalBodies","courses","awards"];
const LIST_FIELDS = ["skills","extracurricular","professionalBodies","courses","awards"];
const REQUIRED_FIELDS = ["rollNumber","name","email","department"];
const DEFAULT_UNIVERSITY = "Mehran University of Engineering & Technology";
// "University Name", "Degree / Program", "Internships" and "Professional Experience" are
// intentionally NOT in EXCEL_REQUIRED_COLUMNS so older Excel files (exported before these
// fields existed) still import cleanly — missing values are handled gracefully.
const EXCEL_COLUMNS = ["Department","Degree","University Name","Roll Number","Name","Email","Contact","LinkedIn","Aspiration","Final Year Project","Internships","Professional Experience","Skills","Extracurricular","Professional Bodies","Courses","Awards"];
const EXCEL_REQUIRED_COLUMNS = EXCEL_COLUMNS.filter(c=> !["Roll Number","University Name","Degree","Internships","Professional Experience"].includes(c));
const COLUMN_TO_FIELD = {
  "Department":"department","Degree":"degree","University Name":"university","Roll Number":"rollNumber","Name":"name","Email":"email","Contact":"contact",
  "LinkedIn":"linkedin","Aspiration":"aspiration","Final Year Project":"fyp","Internships":"internshipsRaw","Professional Experience":"experienceRaw",
  "Skills":"skills","Extracurricular":"extracurricular","Professional Bodies":"professionalBodies",
  "Courses":"courses","Awards":"awards"
};
// Multiple structured entries in one Excel cell: separate entries with " || " and fields
// within an entry with " | ", e.g. Internships cell:
//   "ABC Software | Intern | Jun 2023 | Aug 2023 | Worked on the billing module || XYZ Labs | QA Intern | Jan 2024 | Mar 2024 | Wrote test cases"
// If a cell doesn't match that pattern, the whole text is kept as one entry's description
// rather than being discarded.
function parseEntriesFromText(raw, kind){
  if(!trimVal(raw)) return [];
  return String(raw).split('||').map(s=>s.trim()).filter(Boolean).map(chunk=>{
    const parts = chunk.split('|').map(s=>s.trim());
    if(kind==='experience'){
      if(parts.length>=5){
        return { id:uid(), company:parts[0], title:parts[1], startDate:parts[2], endDate:parts[3], isCurrent:/present/i.test(parts[3]), responsibilities:parts.slice(4).join(' | ') };
      }
      return { id:uid(), company:'', title:'', startDate:'', endDate:'', isCurrent:false, responsibilities:chunk };
    }
    if(parts.length>=4){
      return { id:uid(), organization:parts[0], role:parts[1], startDate:parts[2], endDate:parts[3], description:parts.slice(4).join(' | ') };
    }
    return { id:uid(), organization:'', role:'', startDate:'', endDate:'', description:chunk };
  });
}
// Legacy records saved before Internships/Professional Experience existed — read the old
// single free-text "internship" field as one internship entry so nothing already saved is lost.
function getInternships(r){
  if(r.internships && r.internships.length) return r.internships;
  if(trimVal(r.internship)) return [{ id:'legacy', organization:'', role:'', startDate:'', endDate:'', description:r.internship }];
  return [];
}
function getExperiences(r){ return (r.experiences && r.experiences.length) ? r.experiences : []; }
function formatDateRange(startDate, endDate, isCurrent){
  const s = trimVal(startDate), e = isCurrent ? 'Present' : trimVal(endDate);
  if(s && e) return s + ' \u2013 ' + e;
  return s || e || '';
}
// Academic qualifications: an array of { id, degree, university, startDate, endDate }.
// Records saved before this existed only have flat `degree` / `university` fields — those are
// read as one qualification so nothing already saved is lost.
function getAcademics(r){
  if(r.academics && r.academics.length) return r.academics;
  if(trimVal(r.degree) || trimVal(r.university)){
    return [{ id:'legacy', degree:r.degree||'', university:r.university||'', startDate:'', endDate:'' }];
  }
  return [];
}
// Month-picker values look like "2021-09"; show them as "Sep 2021". Anything else (older
// free-text like "Sep 2021") is shown exactly as typed.
function formatMonthValue(v){
  const s = trimVal(v);
  const m = s.match(/^(\d{4})-(\d{2})(?:-\d{2})?$/);
  if(!m) return s;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const idx = parseInt(m[2],10) - 1;
  return (months[idx] || m[2]) + ' ' + m[1];
}
function formatAcademicRange(startDate, endDate){
  const s = formatMonthValue(startDate), e = formatMonthValue(endDate);
  if(s && e) return s + ' \u2013 ' + e;
  if(s) return s + ' \u2013 Currently enrolled';   // started, no end date => still studying
  return e;                                        // (end date only, or nothing)
}

let alumni = [];      // committed records
let currentView = "dashboard";
let recordsFilter = { search:"", dept:"" };
let pendingImport = null; // { rows: [...], issues summary }

function loadState(){
  try{
    const raw = localStorage.getItem("muet_alumni_v1");
    if(raw) alumni = JSON.parse(raw);
  }catch(e){ alumni = []; }
}
function saveState(){
  try{ localStorage.setItem("muet_alumni_v1", JSON.stringify(alumni)); }catch(e){}
}

/* ============================== UTILS ============================== */
function uid(){ return 'a_' + Math.random().toString(36).slice(2,10); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalizeRoll(roll){ return (roll||"").toString().trim().toLowerCase().replace(/\s+/g,""); }
function trimVal(v){ return v==null ? "" : String(v).trim(); }
function isValidEmail(v){ if(!v) return false; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function isValidUrl(v){ if(!v) return true; return /^https?:\/\/.+\..+/.test(v) || /^(www\.)?linkedin\.com\/.+/i.test(v); }
function splitList(v){
  if(!v) return [];
  return String(v).split(/[,•\n;]+/).map(s=>s.trim()).filter(Boolean);
}
function linkedinLabel(url){
  if(!url) return "";
  let u = url.trim().replace(/^https?:\/\//,'').replace(/^www\./,'');
  u = u.replace(/\/$/,'');
  return u;
}
function linkedinHref(url){
  if(!url) return "#";
  if(/^https?:\/\//i.test(url)) return url;
  return "https://" + url.replace(/^www\./,'');
}
function photoUrl(roll){ return "images/" + normalizeRoll(roll) + ".jpg"; }
// Prefer a manually uploaded photo (stored as a data URL on the record) over the
// auto-detected images/{rollnumber}.jpg file, while still keeping auto-detection working.
function photoSrcFor(r){
  if(r && r.photoDataUrl) return r.photoDataUrl;
  // Roll Number is optional now — with no roll number there is no images/{roll}.jpg to look up.
  if(!r || !trimVal(r.rollNumber)) return placeholderDataUrl(r && r.name);
  return photoUrl(r.rollNumber);
}

const LOGO_MUET_DEFAULT = LOGO_MUET_DIRECT;
const LOGO_ALUMNI_DEFAULT = LOGO_ALUMNI_DIRECT;
let LOGO_MUET = (function(){ try{ return localStorage.getItem('muet_logo_url_v1') || LOGO_MUET_DEFAULT; }catch(e){ return LOGO_MUET_DEFAULT; } })();
let LOGO_ALUMNI = (function(){ try{ return localStorage.getItem('muet_alumni_logo_url_v1') || LOGO_ALUMNI_DEFAULT; }catch(e){ return LOGO_ALUMNI_DEFAULT; } })();
// Two-step fallback for the CV's logo images specifically: proxy -> original direct URL ->
// generated text badge. Never leaves a broken-image icon.
function logoFallbackStep(img, directUrl, badgeUrl){
  if(img.dataset.step !== '1'){ img.dataset.step = '1'; img.src = directUrl; }
  else { img.onerror = null; img.src = badgeUrl; }
}

function checkImageExists(url){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>resolve(true);
    img.onerror = ()=>resolve(false);
    img.src = url + (url.includes('?')?'&':'?') + 'v=' + Date.now();
  });
}

function placeholderDataUrl(name){
  const initials = (name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("") || "?";
  const c = document.createElement('canvas'); c.width=200; c.height=200;
  const ctx = c.getContext('2d');
  ctx.fillStyle = "#E7E2D3"; ctx.fillRect(0,0,200,200);
  ctx.fillStyle = "#C90000"; ctx.font = "700 76px Inter, sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(initials, 100, 108);
  return c.toDataURL('image/png');
}
// Never show a broken-image icon or blank gap for a missing logo file — draw a clean,
// small circular monogram seal instead, closer in feel to an actual logo mark than a
// text button. Real logo files (once present at the paths above, or replaced from
// Settings) always take priority over this and are used as-is, unmodified.
function logoFallbackDataUrl(letters, bg){
  const c = document.createElement('canvas'); c.width=160; c.height=160;
  const ctx = c.getContext('2d');
  ctx.beginPath();
  ctx.arc(80, 80, 78, 0, Math.PI*2);
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(80, 80, 70, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "800 " + (letters.length>1 ? 54 : 64) + "px Inter, sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(letters, 80, 86);
  return c.toDataURL('image/png');
}
window.__logoFallbackMuet = logoFallbackDataUrl("M", "#C90000");
window.__logoFallbackAlumni = logoFallbackDataUrl("MA", "#173A5E");

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}

function validateRecord(r){
  const issues = [];
  // Roll Number is optional. Degree / Qualification is mandatory: at least one academic
  // qualification must exist, and every qualification that is filled in needs a degree.
  if(!trimVal(r.name)) issues.push("Missing Name");
  if(!trimVal(r.department)) issues.push("Missing Department");
  const academics = getAcademics(r);
  if(!academics.length || academics.some(a=>!trimVal(a.degree))) issues.push("Missing Degree / Qualification");
  if(!trimVal(r.email)) issues.push("Missing Email");
  else if(!isValidEmail(r.email)) issues.push("Invalid Email");
  if(trimVal(r.linkedin) && !isValidUrl(r.linkedin)) issues.push("Invalid LinkedIn URL");
  return issues;
}

function serializeEntriesToText(entries, kind){
  if(!entries || !entries.length) return '';
  return entries.map(e=> kind==='experience'
    ? [e.company,e.title,e.startDate,e.endDate,e.responsibilities].join(' | ')
    : [e.organization,e.role,e.startDate,e.endDate,e.description].join(' | ')
  ).join(' || ');
}
function exportAlumniCSV(){

function handleExcelFile(file){
  const isCsv = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const wb = isCsv ? XLSX.read(ev.target.result, { type:'string' }) : XLSX.read(ev.target.result, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(sheet, { defval:"" });
      if(raw.length===0){ toast("The sheet is empty.","error"); return; }
      const headerRow = Object.keys(raw[0]);
      const missingCols = EXCEL_REQUIRED_COLUMNS.filter(c=> !headerRow.includes(c));
      if(missingCols.length){
        renderImportSummary({ error: "Missing required column(s): " + missingCols.join(", ") });
        return;
      }
      const rows = raw.map((row, idx)=>{
        const r = { id: uid(), _rowNum: idx+2 };
        EXCEL_COLUMNS.forEach(col=>{
          r[COLUMN_TO_FIELD[col]] = trimVal(row[col]);
        });
        if(!r.internshipsRaw && row["Internship"]) r.internshipsRaw = trimVal(row["Internship"]); // legacy column name
        r.internships = parseEntriesFromText(r.internshipsRaw, 'internship');
        r.experiences = parseEntriesFromText(r.experienceRaw, 'experience');
        delete r.internshipsRaw; delete r.experienceRaw;
        // The Degree / University Name columns become the student's first academic qualification.
        r.academics = (r.degree || r.university) ? [{ id:uid(), degree:r.degree, university:r.university, startDate:'', endDate:'' }] : [];
        r.issues = validateRecord(r);
        return r;
      });
      // duplicate detection
      const seen = {};
      rows.forEach(r=>{
        const key = normalizeRoll(r.rollNumber);
        if(!key) return;
        seen[key] = (seen[key]||0)+1;
      });
      rows.forEach(r=>{
        const key = normalizeRoll(r.rollNumber);
        if(key && seen[key]>1) r.issues.push("Duplicate Roll Number");
      });
      pendingImport = rows;
      renderImportSummary({ rows });
      // async photo check
      rows.forEach(async r=>{
        r.photoStatus = (trimVal(r.rollNumber) && await checkImageExists(photoUrl(r.rollNumber))) ? 'ok' : 'missing';
        refreshImportPhotoBadge(r.id, r.photoStatus);
      });
    }catch(err){
      toast("Failed to read Excel file: " + err.message, "error");
    }
  };
  if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}
function refreshImportPhotoBadge(id, status){
  const el = document.querySelector(`[data-photo-badge="${id}"]`);
  if(el){
    el.className = 'badge ' + (status==='ok'?'ok':'missing');
    el.textContent = status==='ok' ? 'Photo OK' : 'No Photo';
  }
}
function renderImportSummary(res){
  const box = document.getElementById('importResult');

  }
  const rows = res.rows;
  const validCount = rows.filter(r=>r.issues.length===0).length;
  const dupCount = rows.filter(r=>r.issues.includes("Duplicate Roll Number")).length;
  const invalidCount = rows.length - validCount;
  box.innerHTML = `
  <div class="panel">
    <h3>Import preview — ${rows.length} record(s) found</h3>
    <div style="display:flex;gap:16px;margin-bottom:16px;font-size:13px;">
      <span class="badge ok">${validCount} valid</span>
      <span class="badge bad">${invalidCount} with issues</span>
      <span class="badge missing">${dupCount} duplicate roll numbers</span>
    </div>
    <div style="overflow-x:auto;">
    <table><thead><tr>
      <th>Roll Number</th><th>Name</th><th>Department</th><th>Email</th><th>Photo</th><th>Status</th>
    </tr></thead><tbody>
      ${rows.map(r=>`
        <tr>
          <td>${esc(r.rollNumber)}</td>
          <td>${esc(r.name)}</td>
          <td>${esc(r.department)}</td>
          <td>${esc(r.email)}</td>
          <td><span class="badge missing" data-photo-badge="${r.id}">Checking…</span></td>
          <td>${r.issues.length ? `<span class="badge bad" title="${esc(r.issues.join('; '))}">${r.issues.length} issue(s)</span>` : `<span class="badge ok">OK</span>`}</td>
        </tr>`).join("")}
    </tbody></table>
    </div>
    <div class="form-actions">
      <button class="btn" id="commitImportBtn">Import all ${rows.length} record(s)</button>
      <button class="btn secondary" id="cancelImportBtn">Cancel</button>
    </div>
    <p style="font-size:11.5px;color:var(--ink-soft);margin-top:10px;">
      Records with issues are imported too so you can fix them in Alumni Records — nothing is discarded silently.
    </p>
  </div>`;
  document.getElementById('commitImportBtn').addEventListener('click', ()=>{
    rows.forEach(r=>{ delete r._rowNum; });
    alumni = alumni.concat(rows);
    saveState();
    toast(`Imported ${rows.length} record(s).`, "success");
    pendingImport = null;
    showView('records');
  });
  document.getElementById('cancelImportBtn').addEventListener('click', ()=>{
    pendingImport = null;
    box.innerHTML = "";
  });
}

function collectFormRecord(existing){

  });

  // Alumni Records table, search and CSV export keep working unchanged.
  r.degree = r.academics.length ? r.academics[0].degree : '';
  r.university = r.academics.length ? r.academics[0].university : '';
  r.experiences = collectExperiences();

function showFieldErrors(issues){
  // Only the fieldMeta-driven wrappers (Personal/Academic/Skills) carry data-field and an
  // .err-msg child. The Professional Experience / Internship entry cards also use the
  // "field" class for shared styling but have no .err-msg — querying plain ".field" here
  // used to hit those and crash with "Cannot read properties of null (reading 'style')"
  // on every Generate PDF / Save click as soon as one dynamic entry existed (which is
  // always, since a blank entry is present by default).
  document.querySelectorAll('.field[data-field]').forEach(f=>{ f.classList.remove('error'); const m=f.querySelector('.err-msg'); if(m) m.style.display='none'; });
  const map = {
    "Missing Name":"name","Missing Department":"department",
    "Missing Email":"email","Invalid Email":"email","Invalid LinkedIn URL":"linkedin"
  };
  issues.forEach(issue=>{
    const key = map[issue];
    if(!key) return;
    const f = document.querySelector(`.field[data-field="${key}"]`);
    if(f){ f.classList.add('error'); const m=f.querySelector('.err-msg'); if(m){ m.style.display='block'; m.textContent = issue; } }
  });
  // Academic qualification entries: clear old errors, then flag any entry without a Degree / Qualification.
  document.querySelectorAll('#academicList .field.error').forEach(f=>{ f.classList.remove('error'); const m=f.querySelector('.err-msg'); if(m) m.style.display='none'; });
  if(issues.includes('Missing Degree / Qualification')){
    const entries = Array.from(document.querySelectorAll('#academicList .dyn-entry'));
    const hasContent = el => ['university','startDate','endDate'].some(k=>{ const i=el.querySelector('[data-f="'+k+'"]'); return i && trimVal(i.value); });
    const anyContent = entries.some(hasContent);
    entries.forEach((el, idx)=>{
      const input = el.querySelector('[data-f="degree"]');
      if(input && !trimVal(input.value) && (hasContent(el) || (!anyContent && idx===0))){
        const f = input.closest('.field');
        if(f){ f.classList.add('error'); const m=f.querySelector('.err-msg'); if(m){ m.style.display='block'; m.textContent='Degree / Qualification is required'; } }
      }
    });
  }
  const firstError = document.querySelector('.field.error');
  if(firstError){
    firstError.scrollIntoView({ behavior:'smooth', block:'center' });
    const input = firstError.querySelector('input, textarea');
    if(input) input.focus();
  }
}
function wireFormView(existing){
  try{
    wireFormViewInner(existing);
  }catch(err){
    console.error('wireFormView setup failed:', err);
    toast('Form setup error: ' + (err && err.message ? err.message : err) + ' — please reload the page and check the browser console.', 'error');
  }
}
function wireFormViewInner(existing){
  window.__phform = placeholderDataUrl(existing && existing.name);
  window.__uploadedPhotoDataUrl = (existing && existing.photoDataUrl) || null;
  const rollInput = document.querySelector('[data-k="rollNumber"]');
  const nameInput = document.querySelector('[data-k="name"]');
  const photoImg = document.getElementById('photoPreview');
  const uploadBtn = document.getElementById('photoUploadBtn');
  const removeBtn = document.getElementById('photoRemoveBtn');
  const fileInput = document.getElementById('photoFileInput');

  function refreshPhoto(){
    window.__phform = placeholderDataUrl(nameInput.value);
    if(window.__uploadedPhotoDataUrl){ photoImg.src = window.__uploadedPhotoDataUrl; return; }
    const roll = rollInput.value;
    photoImg.src = roll ? photoUrl(roll) : window.__phform;
  }
  rollInput.addEventListener('input', refreshPhoto);
  nameInput.addEventListener('input', refreshPhoto);

  uploadBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!/^image\/(jpeg|jpg|png)$/.test(file.type)){ toast('Please choose a JPG or PNG image.', 'error'); return; }
    const reader = new FileReader();
    reader.onload = ev=>{
      window.__uploadedPhotoDataUrl = ev.target.result;
      photoImg.src = window.__uploadedPhotoDataUrl;
      uploadBtn.textContent = 'Change Photo';
      removeBtn.style.display = '';
    };
    reader.readAsDataURL(file);
  });
  removeBtn.addEventListener('click', ()=>{
    window.__uploadedPhotoDataUrl = null;
    uploadBtn.textContent = 'Upload Profile Photo';
    removeBtn.style.display = 'none';
    refreshPhoto();
  });

  // Dynamic "+ Add Professional Experience" / "+ Add Internship" / "+ Add Academic
  // Qualification" — every click appends a real, independent, editable entry card; each
  // card's own × button removes only itself.
  document.getElementById('addExpBtn').addEventListener('click', ()=>{
    document.getElementById('experienceList').insertAdjacentHTML('beforeend', renderExperienceEntry({}));
  });
  document.getElementById('addInternBtn').addEventListener('click', ()=>{
    document.getElementById('internshipList').insertAdjacentHTML('beforeend', renderInternshipEntry({}));
  });
  document.getElementById('addAcademicBtn').addEventListener('click', ()=>{
    document.getElementById('academicList').insertAdjacentHTML('beforeend', renderAcademicEntry({}));
  });
  document.getElementById('alumniForm').addEventListener('click', e=>{
    const removeBtnEl = e.target.closest('[data-remove-entry]');
    if(removeBtnEl){ removeBtnEl.closest('.dyn-entry').remove(); }
  });
  document.getElementById('alumniForm').addEventListener('change', e=>{
    if(e.target.matches('[data-f="isCurrent"]')){
      const entry = e.target.closest('.dyn-entry');
      const endInput = entry.querySelector('[data-f="endDate"]');
      endInput.disabled = e.target.checked;
      if(e.target.checked) endInput.value = '';
    }
  });

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    const saveBtn = document.getElementById('saveBtn');
    if(saveBtn && saveBtn.disabled) return; // already saving — ignore extra clicks
    if(saveBtn) saveBtn.disabled = true;
    try{
      const r = collectFormRecord(existing);
      const issues = validateRecord(r);
      showFieldErrors(issues);
      if(issues.length){ toast("Please fix the highlighted fields.", "error"); if(saveBtn) saveBtn.disabled=false; return; }
      (r.photoDataUrl ? Promise.resolve(true) : checkImageExists(photoUrl(r.rollNumber))).then(ok=>{
        r.photoStatus = ok ? 'ok' : 'missing';
        const idx = alumni.findIndex(a=>a.id===r.id);
        if(idx>=0) alumni[idx]=r; else alumni.push(r);
        saveState();
        toast("Alumni record saved.", "success");
        recordsFilter.search = ""; recordsFilter.dept = ""; // don't let a leftover filter hide the record we just saved
        showView('records');
      }).catch(err=>{
        console.error('Save failed:', err);
        toast('Could not save the record: ' + (err && err.message ? err.message : err), 'error');
        if(saveBtn) saveBtn.disabled = false;
      });
    }catch(err){
      console.error('Save failed:', err);
      toast('Could not save the record: ' + (err && err.message ? err.message : err), 'error');
      if(saveBtn) saveBtn.disabled = false;
    }
  });
  document.getElementById('previewBtn').addEventListener('click', ()=>{
    const r = collectFormRecord(existing);
    openModal(renderPreviewModal(r));
  });
  document.getElementById('generateBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('generateBtn');
    if(btn.disabled) return; // already generating — ignore extra clicks
    const r = collectFormRecord(existing);
    const issues = validateRecord(r);
    showFieldErrors(issues);
    if(issues.length){ toast("Fix the highlighted fields before generating a PDF.", "error"); return; }
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Generating…';
    try{
      await downloadSinglePdf(r);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    showView(existing?'records':'add');
    if(!existing) showView('add');
  });
}

function sortEntriesByRecency(entries){
  function score(e){
    if(e.isCurrent) return Infinity;
    const d = Date.parse(e.endDate || e.startDate || '');
    return isNaN(d) ? -Infinity : d;
  }
  return entries.slice().sort((a,b)=> score(b)-score(a));
}
// Splits a free-text description into its own lines (as typed with Enter in the textarea),
// matching the reference CV's plain stacked-line style — no bullet points, no label prefix.
function splitLines(text){
  return String(text||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
}
function renderCvHtml(r){
  const ph = placeholderDataUrl(r.name);
  const expEntries = sortEntriesByRecency(getExperiences(r)).map(e=>({
    title:e.title, org:e.company, dates:formatDateRange(e.startDate,e.endDate,e.isCurrent), desc:e.responsibilities
  }));
  const internEntries = sortEntriesByRecency(getInternships(r)).map(e=>({
    title:e.role, org:e.organization, dates:formatDateRange(e.startDate,e.endDate,false), desc:e.description
  }));
  function entrySection(title, entries){
    if(!entries.length) return '';
    return `<div class="cv-section"><div class="cv-section-head"><h4>${title}</h4><div class="rule"></div></div>${entries.map(e=>`
      <div class="cv-entry">
        <div class="cv-entry-row"><span class="cv-entry-title">${esc(e.title)||'—'}</span>${e.dates?`<span class="cv-entry-dates">${esc(e.dates)}</span>`:''}</div>
        ${e.org?`<div class="cv-entry-org">${esc(e.org)}</div>`:''}
        ${splitLines(e.desc).map(line=>`<p class="cv-entry-desc-line">${esc(line)}</p>`).join("")}
      </div>`).join("")}</div>`;
  }
  function textSection(title, val){
    if(!trimVal(val)) return '';
    return `<div class="cv-section"><div class="cv-section-head"><h4>${title}</h4><div class="rule"></div></div><p>${esc(val)}</p></div>`;
  }
  function tagSection(title, val){
    if(!trimVal(val)) return '';
    return `<div class="cv-section"><div class="cv-section-head"><h4>${title}</h4><div class="rule"></div></div><div class="cv-tags">${splitList(val).map(t=>`<span class="cv-tag">${esc(t)}</span>`).join("")}</div></div>`;
  }
  function listSection(title, val){
    if(!trimVal(val)) return '';
    return `<div class="cv-section"><div class="cv-section-head"><h4>${title}</h4><div class="rule"></div></div><ul class="cv-list">${splitList(val).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  }
  const academicEntries = getAcademics(r).map(a=>({
    title:a.degree, org:a.university, dates:formatAcademicRange(a.startDate,a.endDate)
  })).filter(a=>a.title||a.org);
  function academicSection(){
    if(!academicEntries.length) return '';
    return entrySection('Academic Information', academicEntries);
  }
  const nameParts = (r.name||'Alumni Name').trim();
  return `
  <div class="cv-sheet">
    <div class="cv-topbar"></div>
    <div class="cv-content">
      <div class="cv-headwrap">
        <div class="cv-header">
          <img class="cv-photo" src="${r.photoDataUrl || r.rollNumber ? photoSrcFor(r) : ph}" onerror="this.src='${ph}'">
          <div class="cv-id">
            <h2>${esc(nameParts)}</h2>
            <div class="cv-contact-rows">
              <div class="cv-contact-line">
                ${r.email?`<div class="cv-contact-row">${cvIcon('email')}<span class="cv-contact-email">${esc(r.email)}</span></div>`:''}
                ${r.linkedin?`<div class="cv-contact-row">${cvIcon('linkedin')}<a class="cv-contact-linkedin" href="${linkedinHref(r.linkedin)}" target="_blank">${esc(linkedinLabel(r.linkedin))}</a></div>`:''}
              </div>
              <div class="cv-contact-line">
                ${r.contact?`<div class="cv-contact-row">${cvIcon('phone')}<span class="cv-contact-phone">${esc(r.contact)}</span></div>`:''}
                ${r.rollNumber?`<div class="cv-contact-row">${cvIcon('rollno')}<span>Roll No ${esc(r.rollNumber)}</span></div>`:''}
              </div>
            </div>
          </div>
          <div class="cv-logos">
            <img src="${LOGO_MUET}" crossorigin="anonymous" onerror="logoFallbackStep(this,'${LOGO_MUET_DIRECT}',window.__logoFallbackMuet)">
            <img src="${LOGO_ALUMNI}" crossorigin="anonymous" onerror="logoFallbackStep(this,'${LOGO_ALUMNI_DIRECT}',window.__logoFallbackAlumni)">
          </div>
        </div>
      </div>
      <div class="cv-main-single">
        ${textSection('Career Aspiration / Professional Summary', r.aspiration)}
        ${academicSection()}
        ${textSection('Final Year Project', r.fyp)}
        ${entrySection('Professional Experience', expEntries)}
        ${entrySection('Internships', internEntries)}
        ${tagSection('Skills', r.skills)}
        ${listSection('Courses &amp; Certifications', r.courses)}
        ${listSection('Extracurricular Activities', r.extracurricular)}
        ${listSection('Professional Bodies / Memberships', r.professionalBodies)}
        ${listSection('Awards &amp; Achievements', r.awards)}
      </div>
    </div>
    <div class="cv-footer">Generated by MUET Alumni Management System &middot; ${esc(r.university)||DEFAULT_UNIVERSITY}</div>
  </div>`;
}

/* ============================== PDF GENERATION ============================== */
// Single source of truth: the exact same renderCvHtml() markup used for the on-screen
// "Preview CV" modal is rendered off-screen and rasterized (html2canvas) into the PDF,
// so the preview and the downloaded PDF are guaranteed to match — same layout, spacing,
// fonts, colors, and section order. Supports multiple pages for longer profiles.

function pdfFileName(r){
  const roll = (r.rollNumber||'unknown').toString().trim().toUpperCase().replace(/\s+/g,'');
  const name = (r.name||'alumni').toString().trim().replace(/\s+/g,'_');
  return `MUET_Alumni_CV_${name}_${roll}.pdf`;
}

function waitForImagesOnce(container){
  const imgs = Array.from(container.querySelectorAll('img'));
  return Promise.all(imgs.map(img=> new Promise(resolve=>{
    if(img.complete && img.naturalWidth>0) return resolve();
    img.addEventListener('load', resolve, { once:true });
    img.addEventListener('error', resolve, { once:true });
  })));
}
async function waitForImagesSettled(container){
  await waitForImagesOnce(container);
  await new Promise(r=>setTimeout(r, 80)); // let any onerror->fallback src swap finish loading
  await waitForImagesOnce(container);
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
}

// Add real, precise clickable hotspots for email/phone/LinkedIn over the rasterized CV
// image, using each element's on-screen CSS position converted to PDF millimetres.
function addContactHotspots(doc, sheetEl, record){
  const sheetRect = sheetEl.getBoundingClientRect();
  if(!sheetRect.width) return;
  const mmPerPx = 210 / sheetRect.width;
  const pageHmm = 297;
  function hotspot(el, url){
    if(!el || !url) return;
    const r = el.getBoundingClientRect();
    if(!r.width || !r.height) return;
    const xMm = (r.left - sheetRect.left) * mmPerPx;
    const yTotalMm = (r.top - sheetRect.top) * mmPerPx;
    const wMm = r.width * mmPerPx;
    const hMm = r.height * mmPerPx;
    const page = Math.floor(yTotalMm / pageHmm);
    if(page+1 > doc.internal.getNumberOfPages()) return;
    doc.setPage(page+1);
    doc.link(xMm, yTotalMm - page*pageHmm, wMm, hMm, { url });
  }
  hotspot(sheetEl.querySelector('.cv-contact-email'), record.email ? 'mailto:'+record.email : null);
  hotspot(sheetEl.querySelector('.cv-contact-phone'), record.contact ? 'tel:'+record.contact.replace(/[^0-9+]/g,'') : null);
  hotspot(sheetEl.querySelector('.cv-contact-linkedin'), record.linkedin ? linkedinHref(record.linkedin) : null);
}

async function renderCvToPdfDoc(record){
  const { jsPDF } = window.jspdf;

  // Build the CV off-screen using the exact same template as the on-screen preview.
  //
  // IMPORTANT: this container must stay in normal document flow and fully opaque.
  // An earlier version used position:fixed + opacity:0 to hide it, which is a known
  // trigger for html2canvas's internal DOM-clone/style-measurement pass to fail with
  // "Cannot read properties of null (reading 'style')" — html2canvas re-parents the
  // element into a hidden iframe to measure it, and that combination of fixed
  // positioning + zero opacity does not reliably survive that clone in every browser.
  // Positioning it far off-screen (instead of hiding it) avoids that failure mode.
  const holder = document.createElement('div');
  holder.style.position = 'absolute';
  holder.style.top = '0';
  holder.style.left = '-10000px';
  holder.style.pointerEvents = 'none';
  holder.innerHTML = renderCvHtml(record);
  document.body.appendChild(holder);

  try{
    const sheetEl = holder.querySelector('.cv-sheet');
    if(!sheetEl){
      // Fail loudly with a clear, specific message rather than letting a null-reference
      // TypeError happen a few lines later — this should never actually trigger, since
      // renderCvHtml() always returns a root .cv-sheet element, but if the CV template
      // is ever changed to not include one, this points straight at the real cause.
      throw new Error('CV_CONTAINER_MISSING: renderCvHtml() did not produce a ".cv-sheet" element to render.');
    }
    sheetEl.style.minHeight = '0'; // let content size naturally so multi-page export works

    await waitForImagesSettled(holder);

    const scale = 2; // ~192dpi — sharp text/logos without an oversized file
    const canvas = await html2canvas(sheetEl, { scale, useCORS:true, backgroundColor:'#ffffff' });

    const pageW = 210, pageH = 297;
    const pxPerMm = canvas.width / pageW;
    const pageHeightPx = Math.max(1, Math.round(pxPerMm * pageH));
    const totalPages = Math.max(1, Math.ceil(canvas.height / pageHeightPx));

    const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    for(let p=0; p<totalPages; p++){
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = pageHeightPx;
      const ctx = sliceCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
      ctx.drawImage(canvas, 0, p*pageHeightPx, canvas.width, pageHeightPx, 0, 0, canvas.width, pageHeightPx);
      let imgData;
      try{
        imgData = sliceCanvas.toDataURL('image/jpeg', 0.92);
      }catch(taintErr){
        const err = new Error('CANVAS_TAINTED');
        err.cause = taintErr;
        throw err;
      }
      if(p>0) doc.addPage();
      doc.addImage(imgData, 'JPEG', 0, 0, pageW, pageH);
    }

    addContactHotspots(doc, sheetEl, record);
    return doc;
  } finally {
    document.body.removeChild(holder);
  }
}

function triggerPdfDownload(doc, filename){
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}
let __pdfGenerationInFlight = false;
async function downloadSinglePdf(record){
  if(__pdfGenerationInFlight){ toast('Already generating a PDF — please wait for it to finish.', 'warn'); return; }
  const issues = validateRecord(record);
  if(issues.length){ toast('Cannot generate PDF: ' + issues.join(', '), 'error'); return; }
  __pdfGenerationInFlight = true;
  toast('Generating PDF…');
  try{
    const doc = await renderCvToPdfDoc(record);
    triggerPdfDownload(doc, pdfFileName(record));
    toast('PDF downloaded.', 'success');
  }catch(e){
    if(e && e.message==='CANVAS_TAINTED'){
      toast('PDF blocked by the browser. This usually means either the page was opened by double-clicking (open it via a local server instead — see the README), or a custom logo URL in Settings doesn\u2019t allow cross-origin use. Try resetting logos to default in Settings.', 'error');
    } else {
      toast('Could not generate the PDF: ' + (e && e.message ? e.message : e), 'error');
    }
    console.error('PDF generation failed:', e);
  } finally {
    __pdfGenerationInFlight = false;
  }
}

async function generateBulkZip(records){
  const usable = records.filter(r=> validateRecord(r).length===0);
  const skipped = records.length - usable.length;
  if(usable.length===0){ toast('No valid records to generate.', 'error'); return; }
  toast(`Generating ${usable.length} PDF(s)…`);
  const zip = new JSZip();
  let failed = 0;
  for(const r of usable){
    try{
      const doc = await renderCvToPdfDoc(r);
      zip.file(pdfFileName(r), doc.output('blob'));
    }catch(e){
      if(e && e.message==='CANVAS_TAINTED'){
        toast('PDF blocked by the browser. Open this page via a local server instead of double-clicking it (see README), or reset logos to default in Settings if you set a custom logo URL.', 'error');
        return;
      }
      console.error('PDF generation failed for', r.rollNumber, e);
      failed++;
    }
  }
  if(failed && failed===usable.length){ toast('Could not generate any PDFs — see the browser console for details.', 'error'); return; }
  const blob = await zip.generateAsync({ type:'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MUET_Alumni_CVs.zip';
  document.body.appendChild(a); a.click(); a.remove();
  toast(`ZIP ready (${usable.length-failed} CV${usable.length-failed!==1?'s':''}${skipped?', '+skipped+' skipped due to validation issues':''}${failed?', '+failed+' failed':''}).`, 'success');
}

/* ============================== INIT ============================== */
function refreshSidebarLogo(){
  const el = document.getElementById('sidebarLogo');
  if(!el) return;
  el.onerror = ()=>{ el.onerror=null; el.src = window.__logoFallbackMuet; };
  el.src = LOGO_MUET;
}
loadState();
showView('dashboard');
refreshSidebarLogo();
</script>
